
services:
  backend:
    build:
      context: ./backend
    container_name: ragobs-backend
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://infallible_maxwell:6333
      MONGODB_URL: mongodb://ragobs-mongo:27017
    ports:
      - "8000:8000"
    networks:
      - ragobs-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: ragobs-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ragobs-network
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ragobs-network:
    external: true
    name: ragobs-network
